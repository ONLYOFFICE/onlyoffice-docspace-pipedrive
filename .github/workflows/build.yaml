### This workflow setup instance then build and push images ###
name: Build DocSpace-pipedrive

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Specify backend url"
        type: string
      editor_action_id:
        description: "Specify DocSpace editor custom modal action id"
        type: string
      product_version:
        description: "Specify product version"
        type: string

jobs:
  build:
    name: "Build DocSpace-pipedrive"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_TEST_REGISTRY }}
          username: ${{ secrets.DOCKER_TEST_USERNAME }}
          password: ${{ secrets.DOCKER_TEST_ACCESS_TOKEN }}

      - name: Build
        env:
           BACKEND_URL: ${{  github.event.inputs.backend_url }}
           EDITOR_ACTION_ID: ${{ github.event.inputs.editor_action_id }}
           PRODUCT_VERSION: ${{ github.event.inputs.product_version }}
           REGISTRY: ${{ secrets.DOCKER_TEST_REGISTRY }}
        run: |
          docker compose build \
               --build-arg BACKEND_URL=$BACKEND_URL \
               --build-arg EDITOR_ACTION_ID=$EDITOR_ACTION_ID
          docker compose push

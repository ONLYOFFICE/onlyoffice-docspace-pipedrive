### This workflow setup instance then build and push images ###
name: "Build onlyoffice-docspac-pipedrive"

run-name: "Build onlyoffice-docspace-pipedrive: ${{ github.event.inputs.tag || github.run_number }}"

on:
  push:
    branches:
    - develop

  workflow_dispatch:
    inputs:
      backend_url:
        description: "Specify backend url"
        type: string
        required: false
      tag:
        description: "Specify tag or it will be auto service:rc-<run_number>"
        type: string
        required: false

env:
  BACKEND_URL: ${{ github.event.inputs.backend_url || secrets.BACKEND_URL }}
  DOCKER_HUB_NAMESPACE: onlyoffice

jobs:
  build:
    name: "Build DocSpace-pipedrive"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ frontend, backend ]
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: handle-rc-tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          echo "APP_VERSION=$(cat frontend/package.json | jq -r '.version')" >> "$GITHUB_ENV" # Should be set!
          if [[ "$EVENT" == 'push' && "$REF" == 'develop' ]]; then
           echo "RC_TAG=rc${{ github.run_number }}" >> "$GITHUB_ENV"
          elif [[ "$EVENT" == 'workflow_dispatch' && -z "$TAG" ]]; then
           echo "RC_TAG=rc${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
      
      - name: Publish Image
      uses: docker/build-push-action@v6
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        build-args: |
                BACKEND_URL=${{ env.BACKEND_URL }}
        context: ${{ matrix.service }}/.
        file: ${{ matrix.service}}/Dockerfile
        push: true
        platforms: linux/amd64
        tags: ${{ env.DOCKER_HUB_NAMESPACE }}/pipedrive-docspace-${{ matrix.service }}:${{ env.APP_VERSION }}-${{ github.event.inputs.tag || env.RC_TAG }}
